name: Build Lean Science Toolchains
on:
  workflow_dispatch:

jobs:
  toolchains:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tc: leanprover/lean4:v4.28.0-rc1
            slug: v4.28.0-rc1
          - tc: leanprover/lean4:v4.28.0
            slug: v4.28.0
          - tc: leanprover/lean4:v4.30.0-rc1
            slug: v4.30.0-rc1
          - tc: leanprover/lean4:v4.30.0-rc2
            slug: v4.30.0-rc2
          - tc: leanprover/lean4:v4.30.0
            slug: v4.30.0
          - tc: leanprover/lean4:v4.31.0
            slug: v4.31.0          - tc: leanprover/lean4:v4.32.1
            slug: v4.32.1
          - tc: leanprover/lean4:v4.33.0
            slug: v4.33.0
          - tc: leanprover/lean4:v4.33.1
            slug: v4.33.1
          - tc: leanprover/lean4:nightly-2025-12-01
            slug: nightly-2025-12-01
    steps:
      - name: Install elan and toolchain
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "${{ matrix.tc }}"
          mkdir -p tcwork
          cd tcwork
          elan override set "${{ matrix.tc }}"
          lean --version
          root="$(dirname "$(dirname "$(elan which lean)")")"
          cd ..
          tar -I 'zstd -8 -T0' -cf "lean-${{ matrix.slug }}-linux-x86_64.tar.zst" -C "$(dirname "$root")" "$(basename "$root")"
          sha256sum "lean-${{ matrix.slug }}-linux-x86_64.tar.zst" > "lean-${{ matrix.slug }}-linux-x86_64.sha256"      - uses: actions/upload-artifact@v4
        with:
          name: lean-toolchain-${{ matrix.slug }}-linux-x86_64
          path: |
            lean-${{ matrix.slug }}-linux-x86_64.tar.zst
            lean-${{ matrix.slug }}-linux-x86_64.sha256
          compression-level: 0
          retention-days: 7